# Basic Mosquitto MQTT broker configuration for Pi5 project
# Save this as mosquitto.conf

# Basic configuration
pid_file /var/run/mosquitto.pid

# Persistence settings
persistence true
persistence_location /var/lib/mosquitto/

# Logging settings
log_dest file /var/log/mosquitto/mosquitto.log
log_type all

# Connection settings (allow anonymous connections)
allow_anonymous true
listener 1883 0.0.0.0

# Maximum connections
max_connections -1

# QoS settings
max_inflight_messages 40
max_queued_messages 200

# Security (recommended for local network use only)
# For more secure setup, configure user authentication